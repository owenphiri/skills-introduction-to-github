# XcodeGen spec — run `xcodegen generate` in this folder to produce Nchito.xcodeproj
# Install XcodeGen: `brew install xcodegen`
name: Nchito
options:
  bundleIdPrefix: com.owenphiri
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Nchito
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    # Points Xcode at Assets.xcassets/AppIcon.appiconset. Xcode 14+ derives every
    # size from the single 1024 marketing icon there.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Nchito:
    type: application
    platform: iOS
    sources: [Nchito]
