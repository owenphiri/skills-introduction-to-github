name: Musenga MIS — CI

on:
  push:
    branches: ['**']
    paths: ['Musenga-MIS/**', '.github/workflows/musenga-mis-ci.yml']
  pull_request:
    paths: ['Musenga-MIS/**', '.github/workflows/musenga-mis-ci.yml']

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Musenga-MIS
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Validate index.html
        run: npm run validate

      - name: Syntax-check serverless functions (api/**/*.js)
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Set up Python (for config file validation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate hosting config (vercel.json, netlify.toml)
        run: |
          python3 -c "import json; json.load(open('vercel.json'))"
          python3 -c "import tomllib; tomllib.load(open('netlify.toml','rb'))"

      - name: Check bundle size stays reasonable
        run: |
          size=$(stat -c%s public/index.html)
          echo "public/index.html is $size bytes"
          max=$((5 * 1024 * 1024))
          if [ "$size" -gt "$max" ]; then
            echo "::error::public/index.html exceeds 5MB ($size bytes) — investigate before deploying"
            exit 1
          fi
